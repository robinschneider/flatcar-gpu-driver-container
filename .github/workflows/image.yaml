name: image

on:
  push:
    branches:
      - "**"
    paths:
      - .github/workflows/image.yaml
      - .github/workflows/devcontainer.yaml
      - import-devcontainer.sh
      - Makefile
      - Dockerfile
      - nvidia-driver
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      driver_versions:
        description: Space-separated NVIDIA driver versions to build (empty = use DRIVER_VERSIONS from the Makefile)
        required: false
        default: ""
      flatcar_versions:
        description: Space-separated Flatcar VERSION_ID values to build precompiled images for (empty = use FLATCAR_VERSIONS from the Makefile)
        required: false
        default: ""
      build_precompiled:
        description: Also build precompiled driver images for each driver/Flatcar combination
        type: boolean
        required: false
        default: true
      release:
        description: Tag images without a dev prefix (e.g. 595-6.12.113-flatcar-flatcar0) for use with plain driver.version values
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/driver
  SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      driver_versions: ${{ steps.vars.outputs.driver_versions }}
      flatcar_versions: ${{ steps.vars.outputs.flatcar_versions }}
      flatcar_versions_plain: ${{ steps.vars.outputs.flatcar_versions_plain }}
      build_precompiled: ${{ steps.vars.outputs.build_precompiled }}
    steps:
      - uses: actions/checkout@v6
        name: Check out code

      - name: Compute build matrix
        id: vars
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE: ${{ inputs.release }}
          INPUT_DRIVER_VERSIONS: ${{ inputs.driver_versions }}
          INPUT_FLATCAR_VERSIONS: ${{ inputs.flatcar_versions }}
          INPUT_BUILD_PRECOMPILED: ${{ inputs.build_precompiled }}
        run: |
          # Branch pushes build dev images with a unique commit-based prefix;
          # GitHub Releases (or a manual dispatch with release=true) build clean tags
          # matching the GPU Operator's image reference scheme (see Makefile).
          if [[ "$EVENT_NAME" == "release" ]] || \
             [[ "$EVENT_NAME" == "workflow_dispatch" && "$INPUT_RELEASE" == "true" ]]; then
            echo "version=" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"
          fi
          # Default to the versions maintained in the Makefile
          DRIVERS=$(sed -nE 's/^DRIVER_VERSIONS \?= *//p' Makefile)
          FLATCARS=$(sed -nE 's/^FLATCAR_VERSIONS \?= *//p' Makefile)
          PRECOMPILED="true"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            DRIVERS="${INPUT_DRIVER_VERSIONS:-$DRIVERS}"
            FLATCARS="${INPUT_FLATCAR_VERSIONS:-$FLATCARS}"
            PRECOMPILED="$INPUT_BUILD_PRECOMPILED"
          fi
          # The versions end up in shell commands and image tags.
          for v in $DRIVERS $FLATCARS; do
            [[ "$v" =~ ^[0-9]+(\.[0-9]+)+$ ]] || { echo "Invalid version: $v" >&2; exit 1; }
          done
          echo "Driver versions: $DRIVERS"
          echo "driver_versions=$(echo "$DRIVERS" | jq -R -c 'split(" ") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
          echo "flatcar_versions=$(echo "$FLATCARS" | jq -R -c 'split(" ") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
          echo "flatcar_versions_plain=$FLATCARS" >> "$GITHUB_OUTPUT"
          echo "build_precompiled=$PRECOMPILED" >> "$GITHUB_OUTPUT"

  flatcar:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        driver_version: ${{ fromJSON(needs.setup.outputs.driver_versions) }}
    env:
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        name: Check out code

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Flatcar driver image
        env:
          DRIVER_VERSION: ${{ matrix.driver_version }}
        run: |
          VERSION="$VERSION" \
          DRIVER_VERSIONS="$DRIVER_VERSION" \
          PUSH_ON_BUILD=true \
          make "build-$DRIVER_VERSION"

  devcontainer:
    needs: setup
    if: needs.setup.outputs.build_precompiled == 'true'
    uses: ./.github/workflows/devcontainer.yaml
    with:
      flatcar_versions: ${{ needs.setup.outputs.flatcar_versions_plain }}

  precompiled-flatcar:
    needs: [setup, devcontainer]
    if: needs.setup.outputs.build_precompiled == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        driver_version: ${{ fromJSON(needs.setup.outputs.driver_versions) }}
        flatcar_version: ${{ fromJSON(needs.setup.outputs.flatcar_versions) }}
    env:
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        name: Check out code

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push precompiled Flatcar driver image
        env:
          DRIVER_VERSION: ${{ matrix.driver_version }}
          FLATCAR_VERSION: ${{ matrix.flatcar_version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          VERSION="$VERSION" \
          DRIVER_VERSIONS="$DRIVER_VERSION" \
          FLATCAR_VERSION="$FLATCAR_VERSION" \
          DEVCONTAINER_IMAGE="ghcr.io/${OWNER}/flatcar-devcontainer:${FLATCAR_VERSION}" \
          PUSH_ON_BUILD=true \
          make "build-precompiled-$DRIVER_VERSION"
